name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      qualification_platform:
        description: 'Single-platform qualification target for 0.8.0 (other hosts remain NOT VERIFIED until 1.0.0)'
        required: false
        default: linux-x86_64
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 qualification input
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Record JDK 25 qualification home
        shell: bash
        run: echo "REFACTORKIT_JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up exact JDK 21 build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: gradle

      - name: Set up Python for packaged daemon smoke
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned TypeScript qualification runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: qualification/typescript-toolchain/package-lock.json

      - name: Install pinned TypeScript qualification packages without scripts
        working-directory: qualification/typescript-toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew build

      - name: Run golden tests
        run: ./refactorkit test-golden

      - name: Test policy and packaging verification scripts
        run: |
          python3 scripts/test-verify-v070-roadmap-support-claims.py
          python3 scripts/verify-v070-roadmap-support-claims.py
          python3 scripts/test-verify-v070-kotlin-support.py
          python3 scripts/verify-v070-kotlin-support.py
          python3 scripts/test-finalize-native-k1-k2-shared-foundations.py
          python3 scripts/test-finalize-native-k5-move-next.py
          python3 scripts/test-verify-runtime-archive.py
          python3 scripts/test-finalize-packaged-maven-module-rename-qualification.py
          python3 scripts/test-smoke-packaged-kill-recovery.py
          python3 scripts/test-finalize-packaged-maven-move-class-authority-matrix.py

      - name: Validate architecture documentation
        run: |
          test -f docs/arc42/README.adoc
          test -f docs/arc42/01-introduction-and-goals.adoc
          test -f docs/arc42/12-glossary.adoc
          test -f docs/arc42/appendix-requirements.adoc
          test -f docs/c4/workspace.dsl
          grep -qi 'Status: confirmed' docs/arc42/01-introduction-and-goals.adoc

      - name: Package self-contained CLI
        run: ./gradlew packageCliRuntime distCliRuntimeZip

      - name: Run packaged Maven module-rename qualification
        # This task owns its package prerequisites; unrelated failures must not suppress J1 evidence.
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: >-
          ./gradlew
          :modules:refactorkit-cli:packagedMavenModuleRenameQualificationTest
          :modules:refactorkit-cli:finalizePackagedMavenModuleRenameQualificationEvidence
          --continue

      - name: Upload packaged Maven module-rename qualification logs (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-logs-linux-x86_64
          path: |
            modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/logs/**
            modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/verifier/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification Cucumber JSON (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-cucumber-linux-x86_64
          path: modules/refactorkit-cli/build/reports/cucumber/packaged-maven-module-rename-qualification.json
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification JUnit XML (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-junit-linux-x86_64
          path: |
            modules/refactorkit-cli/build/test-results/packagedMavenModuleRenameQualificationTest/TEST-*.xml
            modules/refactorkit-cli/build/test-results/packagedMavenModuleRenameQualificationTest/**/*.xml
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification manifests (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-manifests-linux-x86_64
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/manifests/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification failure diagnostics (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-failure-diagnostics-linux-x86_64
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/failure-diagnostics/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification candidate checksum (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-checksum-linux-x86_64
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/candidate/refactorkit-runtime.zip.sha256
          if-no-files-found: error

      - name: Verify CLI runtime distribution
        run: |
          sha256sum modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip \
            > modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip.sha256
          sha256sum -c modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip.sha256
          python3 scripts/verify-runtime-archive.py \
            modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip \
            modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip.sha256 \
            --platform linux-x86_64

      - name: Smoke packaged CLI
        run: |
          env -u JAVA_HOME ./gradlew :modules:refactorkit-cli:smokePackagedCli
          env -u JAVA_HOME modules/refactorkit-cli/build/package/refactorkit/bin/refactorkit --help
          env -u JAVA_HOME python3 scripts/smoke-packaged-build-model.py
          for sample in \
            samples/java-maven-simple \
            samples/java-gradle-simple \
            samples/java-spring-simple \
            samples/java-jpa-simple \
            samples/java-multimodule \
            samples/java-maven-reactor-21
          do
            env -u JAVA_HOME modules/refactorkit-cli/build/package/refactorkit/bin/refactorkit scan "$sample"
          done

      - name: Run packaged authoritative Java diagnostics qualification
        run: python3 scripts/smoke-packaged-java-authoritative-diagnostics.py

      - name: Run packaged real TypeScript qualification
        run: python3 scripts/smoke-packaged-typescript.py

      - name: Run packaged real Kotlin qualification
        run: python3 scripts/smoke-packaged-kotlin.py

      - name: Run packaged K5 move-next qualification
        run: python3 scripts/smoke-packaged-k5-move-next.py

      - name: Run packaged kill-during-write recovery
        run: python3 scripts/smoke-packaged-kill-recovery.py

      - name: Run reference workspace budgets
        run: scripts/benchmark-reference.sh modules/refactorkit-cli/build/package/refactorkit/bin/refactorkit

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: modules/refactorkit-cli/build/package/refactorkit
          format: spdx-json
          output-file: modules/refactorkit-cli/build/distributions/refactorkit-runtime.spdx.json
          upload-artifact: false

      - name: Upload CLI runtime distribution
        uses: actions/upload-artifact@v4
        with:
          name: refactorkit-runtime
          path: |
            modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip
            modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip.sha256
            modules/refactorkit-cli/build/distributions/refactorkit-runtime.spdx.json
          if-no-files-found: error

  maven-move-class-native:
    name: Maven move-class authority (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.qualification_platform == 'linux-x86_64' && '[{"os":"ubuntu-latest","platform":"linux-x86_64","gradle":"./gradlew"}]' || '[{"os":"ubuntu-latest","platform":"linux-x86_64","gradle":"./gradlew"},{"os":"windows-2022","platform":"windows-x86_64","gradle":"./gradlew.bat"},{"os":"macos-15-intel","platform":"macos-x86_64","gradle":"./gradlew"},{"os":"macos-15","platform":"macos-aarch64","gradle":"./gradlew"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 25 qualification input
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Record JDK 25 qualification home
        shell: bash
        run: echo "REFACTORKIT_JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up exact JDK 21 build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test native receipt finalizer
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/test-finalize-native-maven-move-class-authority.py"], check=True)

      - name: Package exact self-contained runtime
        timeout-minutes: 20
        run: ${{ matrix.gradle }} :modules:refactorkit-cli:refactorkitRuntimeZip --no-daemon

      - name: Run public-CLI packaged Maven move-class authority
        timeout-minutes: 20
        run: ${{ matrix.gradle }} :modules:refactorkit-cli:packagedMavenMoveClassAuthorityTest --no-daemon

      - name: Run complete packaged Maven move-class authority matrix
        timeout-minutes: 40
        run: ${{ matrix.gradle }} :modules:refactorkit-cli:packagedMavenMoveClassAuthorityMatrixTest --no-daemon

      - name: Finalize revision-bound native qualification receipt
        if: always()
        shell: python
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_PLATFORM: ${{ matrix.platform }}
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path("modules/refactorkit-cli/build/qualification/packaged-maven-move-class-authority") / f"native-{os.environ['QUALIFICATION_PLATFORM']}.json"
          subprocess.run([
              sys.executable,
              "scripts/finalize-native-maven-move-class-authority.py",
              "--repository-root", ".",
              "--build-root", "modules/refactorkit-cli/build",
              "--platform", os.environ["QUALIFICATION_PLATFORM"],
              "--expected-revision", os.environ["SOURCE_REVISION"],
              "--output", str(output),
          ], check=True)

      - name: Upload Maven move-class native qualification (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-move-class-authority-reports-${{ matrix.platform }}
          path: |
            modules/refactorkit-cli/build/reports/cucumber/packaged-maven-move-class-authority*.json
            modules/refactorkit-cli/build/test-results/packagedMavenMoveClassAuthority*/TEST-*.xml
            modules/refactorkit-cli/build/reports/tests/packagedMavenMoveClassAuthority*/**
            modules/refactorkit-cli/build/qualification/packaged-maven-move-class-authority/*.json
          if-no-files-found: warn

  cross-platform-runtime:
    name: Runtime (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            gradle: ./gradlew.bat
          - os: macos-15-intel
            platform: macos-x86_64
            gradle: ./gradlew
          - os: macos-15
            platform: macos-aarch64
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 qualification input
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Record JDK 25 qualification home
        shell: bash
        run: echo "REFACTORKIT_JAVA_25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up exact JDK 21 build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: gradle

      - name: Set up Python for packaged daemon smoke
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned TypeScript qualification runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: qualification/typescript-toolchain/package-lock.json

      - name: Install pinned TypeScript qualification packages without scripts
        working-directory: qualification/typescript-toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test native kill-recovery observer
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/test-smoke-packaged-kill-recovery.py"], check=True)

      - name: Build and test
        run: ${{ matrix.gradle }} build --no-daemon

      - name: Package and native smoke
        run: ${{ matrix.gradle }} :modules:refactorkit-cli:refactorkitRuntimeZip :modules:refactorkit-cli:smokePackagedCli --no-daemon

      - name: Run native packaged Maven module-rename qualification
        # Keep operation qualification independent without masking earlier failed checks.
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: >-
          ${{ matrix.gradle }}
          :modules:refactorkit-cli:packagedMavenModuleRenameQualificationTest
          :modules:refactorkit-cli:finalizePackagedMavenModuleRenameQualificationEvidence
          --continue --no-daemon

      - name: Upload packaged Maven module-rename qualification logs (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-logs-${{ matrix.platform }}
          path: |
            modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/logs/**
            modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/verifier/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification Cucumber JSON (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-cucumber-${{ matrix.platform }}
          path: modules/refactorkit-cli/build/reports/cucumber/packaged-maven-module-rename-qualification.json
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification JUnit XML (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-junit-${{ matrix.platform }}
          path: |
            modules/refactorkit-cli/build/test-results/packagedMavenModuleRenameQualificationTest/TEST-*.xml
            modules/refactorkit-cli/build/test-results/packagedMavenModuleRenameQualificationTest/**/*.xml
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification manifests (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-manifests-${{ matrix.platform }}
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/manifests/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification failure diagnostics (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-failure-diagnostics-${{ matrix.platform }}
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/failure-diagnostics/**
          if-no-files-found: error

      - name: Upload packaged Maven module-rename qualification candidate checksum (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-maven-module-rename-qualification-checksum-${{ matrix.platform }}
          path: modules/refactorkit-cli/build/qualification/packaged-maven-module-rename/candidate/refactorkit-runtime.zip.sha256
          if-no-files-found: error

      - name: Native packaged build-model acceptance
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/smoke-packaged-build-model.py"], check=True)

      - name: Native packaged authoritative Java diagnostics qualification
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/smoke-packaged-java-authoritative-diagnostics.py"], check=True)

      - name: Native packaged real TypeScript qualification
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/smoke-packaged-typescript.py"], check=True)

      - name: Native packaged real Kotlin qualification
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/smoke-packaged-kotlin.py"], check=True)

      - name: Native packaged kill-during-write recovery
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/smoke-packaged-kill-recovery.py"], check=True)

      - name: Summarize native test failures
        if: failure()
        timeout-minutes: 2
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          found = False
          for report in pathlib.Path("modules").glob("*/build/test-results/*/TEST-*.xml"):
              root = ET.parse(report).getroot()
              for case in root.findall("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      found = True
                      message = failure.attrib.get("message", "test failure").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error file={report}::{case.attrib.get('classname')}.{case.attrib.get('name')}: {message}")
          if not found:
              print("No JUnit XML failure was available; inspect the build step.")

      - name: Upload native test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refactorkit-test-reports-${{ matrix.platform }}
          path: |
            modules/*/build/test-results/**
            modules/*/build/reports/tests/**
          if-no-files-found: ignore

      - name: Name platform artifact and checksum
        shell: python
        run: |
          import hashlib, pathlib, shutil
          source = pathlib.Path("modules/refactorkit-cli/build/distributions/refactorkit-runtime.zip")
          target = source.with_name("refactorkit-runtime-${{ matrix.platform }}.zip")
          shutil.copyfile(source, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_suffix(target.suffix + ".sha256").write_text(f"{digest}  {target.name}\n")

      - name: Verify native runtime archive
        shell: python
        run: |
          import pathlib, subprocess, sys
          archive = pathlib.Path("modules/refactorkit-cli/build/distributions/refactorkit-runtime-${{ matrix.platform }}.zip")
          subprocess.run([
              sys.executable, "scripts/verify-runtime-archive.py", str(archive),
              str(archive.with_suffix(archive.suffix + ".sha256")),
              "--platform", "${{ matrix.platform }}",
          ], check=True)

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: refactorkit-runtime-${{ matrix.platform }}
          path: |
            modules/refactorkit-cli/build/distributions/refactorkit-runtime-${{ matrix.platform }}.zip
            modules/refactorkit-cli/build/distributions/refactorkit-runtime-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error

  k1-k2-shared-foundations-native:
    name: K1 K2 shared JVM foundations (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            gradle: ./gradlew
          - os: windows-2025
            platform: windows-x86_64
            gradle: ./gradlew.bat
          - os: macos-15-intel
            platform: macos-x86_64
            gradle: ./gradlew
          - os: macos-15
            platform: macos-aarch64
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact JDK 21 qualification runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify bounded Kotlin support projection
        shell: python
        run: |
          import pathlib, subprocess, sys
          subprocess.run([sys.executable, "scripts/test-verify-v070-kotlin-support.py"], check=True)
          result = subprocess.run([sys.executable, "scripts/verify-v070-kotlin-support.py"], text=True, capture_output=True)
          pathlib.Path("build/qualification/k1-k2-shared").mkdir(parents=True, exist_ok=True)
          pathlib.Path("build/qualification/k1-k2-shared/support-reconciliation.json").write_text(result.stdout)
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          result.check_returncode()

      - name: Run focused K1 K2 and shared-foundation suites
        run: ${{ matrix.gradle }} --no-daemon :modules:refactorkit-core:test --tests org.refactorkit.core.BuildModelsTest --tests org.refactorkit.core.WorkspaceRefreshCoordinatorTest :modules:refactorkit-java:test --tests org.refactorkit.java.JdtJavaAnalysisCacheTest --tests org.refactorkit.java.JdtJavaSemanticAnalyzerTest :modules:refactorkit-kotlin:test --tests org.refactorkit.kotlin.KotlinCompilerAnalysisSessionTest --tests org.refactorkit.kotlin.KotlinCompilerDiagnosticsTest --tests org.refactorkit.kotlin.KotlinJvmBuildModelTest --tests org.refactorkit.kotlin.KotlinLanguageAdapterTest :modules:refactorkit-jvm:test --tests org.refactorkit.jvm.SharedJvmIdentityIndexTest :modules:refactorkit-daemon:test --tests org.refactorkit.daemon.WorkspaceIndexDaemonTest --tests org.refactorkit.daemon.DaemonSessionTest :modules:refactorkit-mcp:test --tests org.refactorkit.mcp.McpSessionTest :modules:refactorkit-lsp:test --tests org.refactorkit.lsp.LspSessionTest :modules:refactorkit-typescript:test --tests org.refactorkit.typescript.TypeScriptBuildModelProviderTest

      - name: Package exact subject
        run: ${{ matrix.gradle }} --no-daemon packageCliRuntime

      - name: Run packaged descriptor-exact Kotlin smoke
        shell: python
        run: |
          import pathlib, subprocess, sys
          result = subprocess.run([sys.executable, "scripts/smoke-packaged-kotlin.py"], text=True, capture_output=True)
          log = result.stdout + result.stderr
          path = pathlib.Path("build/qualification/k1-k2-shared/packaged-kotlin-smoke.log")
          path.write_text(log)
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          result.check_returncode()

      - name: Finalize fail-closed native receipt
        shell: python
        run: |
          import pathlib, subprocess, sys
          output = pathlib.Path("build/qualification/k1-k2-shared/native-${{ matrix.platform }}.json")
          subprocess.run([
              sys.executable, "scripts/finalize-native-k1-k2-shared-foundations.py",
              "--platform", "${{ matrix.platform }}",
              "--revision", "${{ github.event.pull_request.head.sha || github.sha }}",
              "--support-receipt", "build/qualification/k1-k2-shared/support-reconciliation.json",
              "--smoke-log", "build/qualification/k1-k2-shared/packaged-kotlin-smoke.log",
              "--report-root", "modules",
              "--package-root", "modules/refactorkit-cli/build/package/refactorkit",
              "--output", str(output),
          ], check=True)

