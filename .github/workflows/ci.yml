  k5-move-next-native:
    name: K5 move next (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            gradle: ./gradlew
          - os: windows-2025
            platform: windows-x86_64
            gradle: ./gradlew.bat
          - os: macos-15-intel
            platform: macos-x86_64
            gradle: ./gradlew
          - os: macos-15
            platform: macos-aarch64
            gradle: ./gradlew
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up exact JDK 21 qualification runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run exact K5 move-next tests
        run: ${{ matrix.gradle }} --no-daemon :modules:refactorkit-kotlin:test --tests 'org.refactorkit.kotlin.KotlinCompilerDiagnosticsTest.successfulK2CompilationReturnsDurableJvmTypeSymbolsWithExactPsiRanges' :modules:refactorkit-jvm:test --tests 'org.refactorkit.jvm.KotlinJavaPublicTypeRenamePlannerTest.publicTopLevelKotlinFunctionMove*' --tests 'org.refactorkit.jvm.KotlinJavaPublicTypeRenamePlannerTest.standaloneCompanionMoveHasStableRefusalAndNoEdits' --tests 'org.refactorkit.jvm.KotlinMoveDeclarationDiagnosticsRouteTest.kotlinOnlyMoveUsesLazyOperationDiagnosticsRatherThanGenericK2' --tests 'org.refactorkit.jvm.KotlinMoveDeclarationDiagnosticsRouteTest.kotlinOnlyNonMoveRetainsLazyGenericK2Fallback'

      - name: Package exact subject
        run: ${{ matrix.gradle }} --no-daemon packageCliRuntime

      - name: Run packaged K5 move-next smoke
